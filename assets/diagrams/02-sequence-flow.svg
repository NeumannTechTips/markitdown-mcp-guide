<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <marker id="seqArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="seqArrowG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2e7d32"/></marker>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3a4a5a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1180" height="720" fill="url(#bg2)"/>
  <text x="590" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2733">MarkItDown-MCP: Conversion Sequence (Request / Response Lifecycle)</text>
  <text x="590" y="66" text-anchor="middle" font-size="13" fill="#566573">How a single document conversion request travels through an MCP host and back</text>

  <!-- Lifelines -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="60" y="92" width="170" height="48" rx="8" fill="#5e35b1" filter="url(#soft2)"/><text x="145" y="121">User / Workflow</text>
    <rect x="290" y="92" width="170" height="48" rx="8" fill="#1565c0" filter="url(#soft2)"/><text x="375" y="121">LLM (Host)</text>
    <rect x="520" y="92" width="170" height="48" rx="8" fill="#00796b" filter="url(#soft2)"/><text x="605" y="114">MCP Client</text><text x="605" y="131" font-size="10" font-weight="400">runtime</text>
    <rect x="750" y="92" width="170" height="48" rx="8" fill="#1976d2" filter="url(#soft2)"/><text x="835" y="114">MarkItDown-MCP</text><text x="835" y="131" font-size="10" font-weight="400">server (1 tool)</text>
    <rect x="980" y="92" width="160" height="48" rx="8" fill="#37474f" filter="url(#soft2)"/><text x="1060" y="114">Converter +</text><text x="1060" y="131" font-size="10" font-weight="400">source artefact</text>
  </g>
  <g stroke="#c3cdd9" stroke-width="2" stroke-dasharray="4 5">
    <line x1="145" y1="140" x2="145" y2="650"/>
    <line x1="375" y1="140" x2="375" y2="650"/>
    <line x1="605" y1="140" x2="605" y2="650"/>
    <line x1="835" y1="140" x2="835" y2="650"/>
    <line x1="1060" y1="140" x2="1060" y2="650"/>
  </g>

  <!-- Messages -->
  <g font-size="12" fill="#1a2733">
    <!-- 1 -->
    <line x1="145" y1="180" x2="373" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#seqArrow)"/>
    <text x="259" y="172" text-anchor="middle">1 · "Summarise this report.pdf"</text>
    <!-- 2 -->
    <rect x="300" y="200" width="150" height="34" rx="6" fill="#ede7f6" stroke="#c5b3e6"/>
    <text x="375" y="221" text-anchor="middle" font-size="11">2 · Selects conversion tool</text>
    <!-- 3 -->
    <line x1="375" y1="258" x2="603" y2="258" stroke="#1565c0" stroke-width="2" marker-end="url(#seqArrow)"/>
    <text x="489" y="250" text-anchor="middle">3 · tools/call request</text>
    <!-- 4 -->
    <line x1="605" y1="296" x2="833" y2="296" stroke="#1565c0" stroke-width="2" marker-end="url(#seqArrow)"/>
    <text x="719" y="288" text-anchor="middle">4 · convert_to_markdown(uri)</text>
    <!-- 5 -->
    <line x1="835" y1="334" x2="1058" y2="334" stroke="#37474f" stroke-width="2" marker-end="url(#seqArrow)"/>
    <text x="947" y="326" text-anchor="middle" font-size="11">5 · Detect type · route converter</text>
    <!-- 6 -->
    <rect x="985" y="352" width="150" height="50" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
    <text x="1060" y="372" text-anchor="middle" font-size="10.5">6 · In-memory parse</text>
    <text x="1060" y="390" text-anchor="middle" font-size="10.5">structure preserved</text>
    <!-- 7 -->
    <line x1="1058" y1="424" x2="837" y2="424" stroke="#2e7d32" stroke-width="2" marker-end="url(#seqArrowG)"/>
    <text x="947" y="416" text-anchor="middle" font-size="11">7 · Structured Markdown</text>
    <!-- 8 -->
    <line x1="833" y1="462" x2="607" y2="462" stroke="#2e7d32" stroke-width="2" marker-end="url(#seqArrowG)"/>
    <text x="719" y="454" text-anchor="middle">8 · tool result (text)</text>
    <!-- 9 -->
    <line x1="603" y1="500" x2="377" y2="500" stroke="#2e7d32" stroke-width="2" marker-end="url(#seqArrowG)"/>
    <text x="489" y="492" text-anchor="middle">9 · Markdown into context</text>
    <!-- 10 -->
    <rect x="300" y="520" width="150" height="34" rx="6" fill="#ede7f6" stroke="#c5b3e6"/>
    <text x="375" y="541" text-anchor="middle" font-size="11">10 · Reasons over Markdown</text>
    <!-- 11 -->
    <line x1="375" y1="578" x2="147" y2="578" stroke="#2e7d32" stroke-width="2" marker-end="url(#seqArrowG)"/>
    <text x="261" y="570" text-anchor="middle">11 · Grounded answer + citations</text>
  </g>

  <!-- Notes -->
  <rect x="60" y="606" width="1080" height="86" rx="10" fill="#ffffff" stroke="#cfd8e3" filter="url(#soft2)"/>
  <text x="78" y="630" font-size="12.5" font-weight="700" fill="#1565c0">Key properties</text>
  <text x="78" y="652" font-size="11.5" fill="#44525e">• The host (LLM + MCP client) is fully interchangeable — the same server works for Claude Desktop, Claude Code, Cursor, VS Code or any MCP agent.</text>
  <text x="78" y="672" font-size="11.5" fill="#44525e">• One tool only (convert_to_markdown) — the model cannot pick the wrong tool. Conversion is in-memory; no temporary files are written to disk.</text>
  <text x="78" y="690" font-size="11" fill="#7a8a99" font-style="italic">Consent / approval gating (step 3) is enforced by the MCP client before any tool call executes.</text>
</svg>
