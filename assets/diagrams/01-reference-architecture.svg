<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3a4a5a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="760" fill="url(#bgGrad)"/>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2733">MarkItDown-MCP: End-to-End Reference Architecture</text>
  <text x="640" y="70" text-anchor="middle" font-size="14" fill="#566573">Technology-agnostic view of document ingestion into any MCP-compatible AI host and downstream RAG / vector pipeline</text>

  <!-- TIER 1: Sources -->
  <rect x="30" y="110" width="230" height="560" rx="12" fill="#ffffff" stroke="#cfd8e3" filter="url(#soft)"/>
  <text x="145" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1565c0">1 · SOURCE ARTEFACTS</text>
  <line x1="55" y1="150" x2="235" y2="150" stroke="#e0e6ee"/>
  <g font-size="12.5" fill="#33424f">
    <rect x="55" y="166" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="188" text-anchor="middle">PDF · DOCX · PPTX</text>
    <rect x="55" y="208" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="230" text-anchor="middle">XLSX · CSV · JSON · XML</text>
    <rect x="55" y="250" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="272" text-anchor="middle">HTML · EPUB · MSG</text>
    <rect x="55" y="292" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="314" text-anchor="middle">Images (EXIF / OCR)</text>
    <rect x="55" y="334" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="356" text-anchor="middle">Audio (transcription)</text>
    <rect x="55" y="376" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="398" text-anchor="middle">Web URL · YouTube</text>
    <rect x="55" y="418" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#bcd5f0"/><text x="145" y="440" text-anchor="middle">ZIP (recursive)</text>
  </g>
  <text x="145" y="488" text-anchor="middle" font-size="11.5" fill="#7a8a99" font-style="italic">Referenced by URI scheme:</text>
  <text x="145" y="506" text-anchor="middle" font-size="11.5" fill="#7a8a99" font-style="italic">file:// · http(s):// · data:</text>
  <rect x="55" y="528" width="180" height="120" rx="8" fill="#fff8e1" stroke="#f0d98a"/>
  <text x="145" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d00">Untrusted Input?</text>
  <text x="145" y="574" text-anchor="middle" font-size="11" fill="#8a6d00">Sanitise &amp; validate</text>
  <text x="145" y="592" text-anchor="middle" font-size="11" fill="#8a6d00">before the boundary:</text>
  <text x="145" y="610" text-anchor="middle" font-size="11" fill="#8a6d00">restrict paths,</text>
  <text x="145" y="628" text-anchor="middle" font-size="11" fill="#8a6d00">block metadata IPs</text>

  <!-- TIER 2: AI Host / MCP Client -->
  <rect x="300" y="110" width="270" height="560" rx="12" fill="#ffffff" stroke="#cfd8e3" filter="url(#soft)"/>
  <text x="435" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1565c0">2 · MCP HOST (AI CLIENT)</text>
  <line x1="325" y1="150" x2="545" y2="150" stroke="#e0e6ee"/>
  <text x="435" y="172" text-anchor="middle" font-size="11.5" fill="#7a8a99" font-style="italic">Any MCP-compatible agent</text>

  <rect x="325" y="186" width="220" height="120" rx="8" fill="#ede7f6" stroke="#c5b3e6"/>
  <text x="435" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#5e35b1">Large Language Model</text>
  <text x="435" y="232" text-anchor="middle" font-size="11.5" fill="#5e4a82">Reasoning &amp; orchestration</text>
  <text x="435" y="254" text-anchor="middle" font-size="11.5" fill="#5e4a82">Reads Markdown natively</text>
  <text x="435" y="276" text-anchor="middle" font-size="11.5" fill="#5e4a82">Decides when to call</text>
  <text x="435" y="294" text-anchor="middle" font-size="11.5" fill="#5e4a82">the conversion tool</text>

  <rect x="325" y="320" width="220" height="92" rx="8" fill="#e0f2f1" stroke="#9fd3cd"/>
  <text x="435" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#00796b">MCP Client Runtime</text>
  <text x="435" y="366" text-anchor="middle" font-size="11.5" fill="#1a5e57">Tool discovery &amp; invocation</text>
  <text x="435" y="386" text-anchor="middle" font-size="11.5" fill="#1a5e57">Manages transport session</text>
  <text x="435" y="404" text-anchor="middle" font-size="11.5" fill="#1a5e57">Approval / consent gating</text>

  <text x="435" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#33424f">Examples (interchangeable)</text>
  <g font-size="11.5" fill="#33424f">
    <rect x="335" y="458" width="95" height="30" rx="6" fill="#f1f4f8" stroke="#d3dbe5"/><text x="382" y="478" text-anchor="middle">Claude Desktop</text>
    <rect x="440" y="458" width="95" height="30" rx="6" fill="#f1f4f8" stroke="#d3dbe5"/><text x="487" y="478" text-anchor="middle">Claude Code</text>
    <rect x="335" y="494" width="95" height="30" rx="6" fill="#f1f4f8" stroke="#d3dbe5"/><text x="382" y="514" text-anchor="middle">Cursor / VS Code</text>
    <rect x="440" y="494" width="95" height="30" rx="6" fill="#f1f4f8" stroke="#d3dbe5"/><text x="487" y="514" text-anchor="middle">Any MCP agent</text>
  </g>
  <rect x="335" y="536" width="200" height="112" rx="8" fill="#f1f4f8" stroke="#d3dbe5"/>
  <text x="435" y="558" text-anchor="middle" font-size="12" font-weight="700" fill="#33424f">Transport Layer</text>
  <text x="435" y="580" text-anchor="middle" font-size="11.5" fill="#566573">STDIO (default, local)</text>
  <text x="435" y="600" text-anchor="middle" font-size="11.5" fill="#566573">Streamable HTTP (localhost)</text>
  <text x="435" y="620" text-anchor="middle" font-size="11.5" fill="#566573">SSE (localhost)</text>
  <text x="435" y="640" text-anchor="middle" font-size="10.5" fill="#9a3b3b">No auth → bind to localhost</text>

  <!-- TIER 3: MarkItDown MCP Server -->
  <rect x="610" y="110" width="290" height="560" rx="12" fill="#ffffff" stroke="#cfd8e3" filter="url(#soft)"/>
  <text x="755" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1565c0">3 · MARKITDOWN-MCP SERVER</text>
  <line x1="635" y1="150" x2="875" y2="150" stroke="#e0e6ee"/>
  <text x="755" y="172" text-anchor="middle" font-size="11.5" fill="#7a8a99" font-style="italic">Single tool: convert_to_markdown(uri)</text>

  <rect x="635" y="188" width="240" height="70" rx="8" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="755" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Orchestrator (MarkItDown)</text>
  <text x="755" y="234" text-anchor="middle" font-size="11.5" fill="#1a4f80">Priority-based converter registry</text>
  <text x="755" y="250" text-anchor="middle" font-size="11.5" fill="#1a4f80">In-memory · no temp files</text>

  <rect x="635" y="270" width="240" height="58" rx="8" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="755" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">Magika File-Type Detection</text>
  <text x="755" y="312" text-anchor="middle" font-size="11.5" fill="#2c5e2f">ML-based MIME / extension guess</text>

  <rect x="635" y="340" width="240" height="190" rx="8" fill="#fafbfc" stroke="#d3dbe5"/>
  <text x="755" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#33424f">Format-Specific Converters</text>
  <g font-size="11" fill="#44525e">
    <rect x="648" y="374" width="98" height="26" rx="5" fill="#eef2f7"/><text x="697" y="391" text-anchor="middle">DocxConverter</text>
    <rect x="752" y="374" width="110" height="26" rx="5" fill="#eef2f7"/><text x="807" y="391" text-anchor="middle">PdfConverter</text>
    <rect x="648" y="406" width="98" height="26" rx="5" fill="#eef2f7"/><text x="697" y="423" text-anchor="middle">XlsxConverter</text>
    <rect x="752" y="406" width="110" height="26" rx="5" fill="#eef2f7"/><text x="807" y="423" text-anchor="middle">PptxConverter</text>
    <rect x="648" y="438" width="98" height="26" rx="5" fill="#eef2f7"/><text x="697" y="455" text-anchor="middle">HtmlConverter</text>
    <rect x="752" y="438" width="110" height="26" rx="5" fill="#eef2f7"/><text x="807" y="455" text-anchor="middle">ImageConverter</text>
    <rect x="648" y="470" width="98" height="26" rx="5" fill="#eef2f7"/><text x="697" y="487" text-anchor="middle">AudioConverter</text>
    <rect x="752" y="470" width="110" height="26" rx="5" fill="#eef2f7"/><text x="807" y="487" text-anchor="middle">+ 10 more</text>
  </g>
  <text x="755" y="518" text-anchor="middle" font-size="10.5" fill="#7a8a99" font-style="italic">Pluggable: 3rd-party + OCR plugins</text>

  <rect x="635" y="542" width="240" height="106" rx="8" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="755" y="564" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e65100">Optional Enrichment</text>
  <text x="755" y="586" text-anchor="middle" font-size="11.5" fill="#a8480a">LLM image captioning</text>
  <text x="755" y="606" text-anchor="middle" font-size="11.5" fill="#a8480a">Azure Document Intelligence</text>
  <text x="755" y="626" text-anchor="middle" font-size="11.5" fill="#a8480a">markitdown-ocr (LLM Vision)</text>

  <!-- TIER 4: Output + Downstream -->
  <rect x="940" y="110" width="310" height="560" rx="12" fill="#ffffff" stroke="#cfd8e3" filter="url(#soft)"/>
  <text x="1095" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1565c0">4 · OUTPUT &amp; DOWNSTREAM</text>
  <line x1="965" y1="150" x2="1225" y2="150" stroke="#e0e6ee"/>

  <rect x="965" y="166" width="260" height="72" rx="8" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="1095" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Clean Structured Markdown</text>
  <text x="1095" y="212" text-anchor="middle" font-size="11.5" fill="#2c5e2f">Headings · tables · lists · links</text>
  <text x="1095" y="230" text-anchor="middle" font-size="11.5" fill="#2c5e2f">~30–70% token reduction</text>

  <rect x="965" y="252" width="260" height="60" rx="8" fill="#eceff1" stroke="#cfd8dc"/>
  <text x="1095" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#37474f">Chunking / Segmentation</text>
  <text x="1095" y="296" text-anchor="middle" font-size="11.5" fill="#546470">Semantic / heading-aware splits</text>

  <rect x="965" y="326" width="260" height="60" rx="8" fill="#eceff1" stroke="#cfd8dc"/>
  <text x="1095" y="350" text-anchor="middle" font-size="12.5" font-weight="700" fill="#37474f">Embedding Model</text>
  <text x="1095" y="370" text-anchor="middle" font-size="11.5" fill="#546470">Text → dense vector tokens</text>

  <rect x="965" y="400" width="260" height="74" rx="8" fill="#e1f5fe" stroke="#81d4fa"/>
  <text x="1095" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0277bd">Vector Database</text>
  <text x="1095" y="444" text-anchor="middle" font-size="11.5" fill="#0a5a85">ANN index · cosine / dot-product</text>
  <text x="1095" y="462" text-anchor="middle" font-size="11.5" fill="#0a5a85">Metadata filtering · hybrid search</text>

  <rect x="965" y="488" width="260" height="74" rx="8" fill="#ede7f6" stroke="#c5b3e6"/>
  <text x="1095" y="512" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5e35b1">Retrieval-Augmented Generation</text>
  <text x="1095" y="532" text-anchor="middle" font-size="11.5" fill="#5e4a82">Top-k retrieval → grounded prompt</text>
  <text x="1095" y="550" text-anchor="middle" font-size="11.5" fill="#5e4a82">Citations · reduced hallucination</text>

  <rect x="965" y="576" width="260" height="72" rx="8" fill="#fce4ec" stroke="#f8bbd0"/>
  <text x="1095" y="600" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2185b">Consuming Workloads</text>
  <text x="1095" y="620" text-anchor="middle" font-size="11.5" fill="#8a1444">Agents · chatbots · search · QA</text>
  <text x="1095" y="638" text-anchor="middle" font-size="11.5" fill="#8a1444">Analytics · knowledge bases</text>

  <!-- Flow arrows -->
  <line x1="260" y1="300" x2="300" y2="300" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="360" x2="610" y2="360" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="590" y="350" text-anchor="middle" font-size="10" fill="#1565c0">MCP call</text>
  <line x1="610" y1="392" x2="570" y2="392" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="590" y="412" text-anchor="middle" font-size="10" fill="#1565c0">Markdown</text>
  <line x1="900" y1="300" x2="940" y2="300" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="640" y="724" text-anchor="middle" font-size="11" fill="#90a0ad">Convert at the boundary — one Markdown format flows through chunking, embedding, vector storage and retrieval, regardless of source format or MCP host.</text>
  <text x="640" y="744" text-anchor="middle" font-size="10.5" fill="#b0bcc7">MarkItDown-MCP is published by Microsoft under the MIT licence · github.com/microsoft/markitdown</text>
</svg>
